name: Build exe

# Builds StupidFrog.exe on Windows.
# - Every push to main: download it under "Actions" -> latest run -> "Artifacts".
# - A tag like v1.0.0: the .exe is attached to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # Needed to create the release for tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build
        run: python -m PyInstaller --noconfirm --clean StupidFrog.spec
      - uses: actions/upload-artifact@v4
        with:
          name: StupidFrog
          path: dist/StupidFrog.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StupidFrog.exe
